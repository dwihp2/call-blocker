name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (typecheck + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  swift-matching-contract:
    name: Swift engine (matching contract)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run fixtures/matching.json through the Swift engine
        run: |
          swiftc -O modules/call-directory/ios/RuleEngine.swift \
                 modules/call-directory/tests/run-fixtures.swift \
                 -o "$RUNNER_TEMP/cd-fixtures"
          "$RUNNER_TEMP/cd-fixtures" fixtures/matching.json

  kotlin-matching-contract:
    name: Kotlin engine (matching contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # gradle/actions writes its caches with the workflow token
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --no-install
      - name: Run fixtures/matching.json through the Kotlin engine
        run: npm run fixtures:jvm
